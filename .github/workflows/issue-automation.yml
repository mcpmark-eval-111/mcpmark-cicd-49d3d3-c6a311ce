name: Issue Management Automation

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read
  repository-projects: write

jobs:
  ensure-labels:
    name: Ensure required labels exist
    runs-on: ubuntu-latest
    steps:
      - name: Create or update required labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'bug',                    color: 'd73a4a', description: "Something isn't working" },
              { name: 'enhancement',            color: 'a2eeef', description: 'New feature or request' },
              { name: 'epic',                   color: '8b5cf6', description: 'Large feature requiring multiple sub-tasks' },
              { name: 'maintenance',            color: 'fbca04', description: 'Maintenance and housekeeping tasks' },
              { name: 'priority-critical',      color: 'b60205', description: 'Critical priority issue' },
              { name: 'priority-high',          color: 'd93f0b', description: 'High priority issue' },
              { name: 'priority-medium',        color: 'fbca04', description: 'Medium priority issue' },
              { name: 'priority-low',           color: '0e8a16', description: 'Low priority issue' },
              { name: 'needs-triage',           color: 'ededed', description: 'Needs to be reviewed by maintainers' },
              { name: 'needs-review',           color: '5319e7', description: 'Awaiting review from maintainers' },
              { name: 'first-time-contributor', color: '7057ff', description: 'Issue created by first-time contributor' },
            ];
            for (const lbl of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...lbl,
                });
                core.info(`Created label: ${lbl.name}`);
              } catch (e) {
                if (e.status === 422) {
                  try {
                    await github.rest.issues.updateLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: lbl.name,
                      color: lbl.color,
                      description: lbl.description,
                    });
                    core.info(`Updated existing label: ${lbl.name}`);
                  } catch (e2) {
                    core.warning(`Could not update label ${lbl.name}: ${e2.message}`);
                  }
                } else {
                  core.warning(`Could not create label ${lbl.name}: ${e.message}`);
                }
              }
            }

  issue-triage:
    name: Triage issue
    needs: ensure-labels
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Apply category, priority and triage labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const rawTitle = issue.title || '';
            const title = rawTitle.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const text = title + '\n' + body;

            const isSubtask = rawTitle.startsWith('[SUBTASK]');

            const toAdd = new Set();
            // Every issue starts as needing triage.
            toAdd.add('needs-triage');

            if (!isSubtask) {
              // Category labels (driven by title only).
              if (title.includes('bug')) toAdd.add('bug');
              if (title.includes('epic')) toAdd.add('epic');
              if (title.includes('maintenance')) toAdd.add('maintenance');

              // Priority labels (driven by title OR body); highest priority wins.
              const hasAny = (kws) => kws.some((k) => text.includes(k));
              if (hasAny(['critical', 'urgent', 'production', 'outage'])) {
                toAdd.add('priority-critical');
              } else if (hasAny(['important', 'high', 'blocking'])) {
                toAdd.add('priority-high');
              } else if (hasAny(['low', 'nice-to-have', 'minor'])) {
                toAdd.add('priority-low');
              } else {
                // Medium is also the default if nothing matched.
                toAdd.add('priority-medium');
              }
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [...toAdd],
              });
              core.info(`Added labels: ${[...toAdd].join(', ')}`);
            } catch (e) {
              core.warning(`Failed to add triage labels: ${e.message}`);
            }

  task-breakdown:
    name: Break epic into sub-tasks
    needs: issue-triage
    if: >-
      github.event.action == 'opened' &&
      contains(github.event.issue.title, 'Epic') &&
      !startsWith(github.event.issue.title, '[SUBTASK]')
    runs-on: ubuntu-latest
    steps:
      - name: Create 4 sub-issues and link them
        uses: actions/github-script@v7
        with:
          script: |
            const parent = context.payload.issue;
            const tasks = [
              'Requirements Analysis',
              'Design and Architecture',
              'Implementation',
              'Testing and Documentation',
            ];

            const created = [];
            for (let i = 0; i < tasks.length; i++) {
              const taskName = tasks[i];
              const subTitle = `[SUBTASK] ${parent.title} - Task ${i + 1}: ${taskName}`;
              const subBody = [
                `Sub-task automatically created from epic #${parent.number}.`,
                ``,
                `Related to #${parent.number}`,
                ``,
                `### Task ${i + 1} of 4: ${taskName}`,
                ``,
                `Part of the epic **${parent.title}**.`,
                ``,
                `Please use this issue to discuss work specific to "${taskName}".`,
              ].join('\n');

              try {
                const res = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: subTitle,
                  body: subBody,
                  labels: ['enhancement', 'needs-review'],
                });
                created.push({ number: res.data.number, name: taskName });
                core.info(`Created sub-issue #${res.data.number}: ${subTitle}`);
              } catch (e) {
                core.warning(`Failed to create sub-issue ${i + 1}: ${e.message}`);
              }
            }

            if (created.length === 0) {
              core.warning('No sub-issues were created; skipping parent body update.');
              return;
            }

            // Append an "Epic Tasks" checklist to the parent body, linking each sub-issue.
            const checklist = ['', '## Epic Tasks', ''];
            for (let i = 0; i < created.length; i++) {
              checklist.push(
                `- [ ] Task ${i + 1}: ${created[i].name} (#${created[i].number})`
              );
            }
            const newBody = (parent.body || '').replace(/\s*$/, '') + '\n' + checklist.join('\n') + '\n';

            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parent.number,
                body: newBody,
              });
              core.info(`Updated parent issue #${parent.number} with Epic Tasks checklist.`);
            } catch (e) {
              core.warning(`Failed to update parent issue body: ${e.message}`);
            }

  auto-response:
    name: Auto-respond to new issue
    needs: [issue-triage, task-breakdown]
    if: >-
      always() &&
      github.event.action == 'opened' &&
      needs.issue-triage.result == 'success' &&
      !startsWith(github.event.issue.title, '[SUBTASK]')
    runs-on: ubuntu-latest
    steps:
      - name: Welcome, classify, milestone, advance status
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const author = (issue.user && issue.user.login) || 'there';

            // Re-fetch the issue so we get whatever labels triage just applied.
            let current;
            try {
              const res = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
              });
              current = res.data;
            } catch (e) {
              core.warning(`Could not refetch issue: ${e.message}`);
              current = issue;
            }
            const labelNames = (current.labels || []).map((l) =>
              typeof l === 'string' ? l : l.name
            );

            const isBug = labelNames.includes('bug');
            const isEpic = labelNames.includes('epic');
            const isMaintenance = labelNames.includes('maintenance');
            const isHighOrCritical =
              labelNames.includes('priority-high') ||
              labelNames.includes('priority-critical');

            // First-time contributor detection (first issue in THIS repo).
            let isFirstTimer = false;
            try {
              const res = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                creator: author,
                state: 'all',
                per_page: 100,
              });
              const otherIssues = res.data.filter(
                (i) => !i.pull_request && i.number !== issue.number
              );
              isFirstTimer = otherIssues.length === 0;
            } catch (e) {
              core.warning(`First-timer detection failed: ${e.message}`);
            }

            if (isFirstTimer) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['first-time-contributor'],
                });
              } catch (e) {
                core.warning(`Could not add first-time-contributor label: ${e.message}`);
              }
            }

            // Build comment body.
            const lines = [];
            lines.push(`Hi @${author}, thanks for opening this issue! 👋`);
            lines.push('');
            if (isFirstTimer) {
              lines.push(`### Welcome!`);
              lines.push(
                `It looks like this is your first issue in this repository — welcome aboard! ` +
                `We really appreciate you taking the time to report this. A maintainer will ` +
                `take a look as soon as possible.`
              );
              lines.push('');
            }

            if (isBug) {
              lines.push(`## Bug Report Guidelines`);
              lines.push('');
              lines.push(`To help us reproduce and fix this bug quickly, please make sure your report contains:`);
              lines.push(`- Clear **steps to reproduce** the problem.`);
              lines.push(`- The **expected behaviour** vs. the **actual behaviour**.`);
              lines.push(`- Your **environment** (OS, Node.js version, browser, package versions, …).`);
              lines.push(`- Relevant **logs**, **stack traces** or **screenshots**.`);
              lines.push(`- A **minimal reproducible example**, if possible.`);
              lines.push('');
              lines.push(`A maintainer will triage this report and follow up here.`);
            } else if (isEpic) {
              lines.push(`## Feature Request Process`);
              lines.push('');
              lines.push(`Thanks for filing an epic-sized feature request! Our process is:`);
              lines.push(`1. We've automatically broken this epic into **4 sub-tasks** — Requirements Analysis, Design & Architecture, Implementation, and Testing & Documentation.`);
              lines.push(`2. A maintainer will refine scope and priority during triage.`);
              lines.push(`3. High-level discussion happens **here**; implementation details belong in the linked sub-issues.`);
              lines.push(`4. Once we've agreed on direction, we'll schedule the work into a milestone.`);
              lines.push('');
              lines.push(`See the **Epic Tasks** checklist that has been appended to the description above.`);
            } else if (isMaintenance) {
              lines.push(`## Maintenance Guidelines`);
              lines.push('');
              lines.push(`Thanks for filing a maintenance task. Before a maintainer picks this up, please ensure:`);
              lines.push(`- The **motivation** (tech debt, deprecation, dependency upgrade, refactor, …) is clearly described.`);
              lines.push(`- Any **breaking-change** implications or migration steps are flagged.`);
              lines.push(`- Linked PRs reference this issue using \`Fixes #${issue.number}\` once work begins.`);
              lines.push(`- The change keeps tests, lint, and formatting green.`);
            } else {
              lines.push(`A maintainer will triage this issue shortly. Thanks for your patience!`);
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: lines.join('\n'),
              });
            } catch (e) {
              core.warning(`Failed to post auto-response comment: ${e.message}`);
            }

            // Milestone for high/critical priority.
            if (isHighOrCritical) {
              try {
                let milestone = null;
                const ms = await github.rest.issues.listMilestones({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all',
                  per_page: 100,
                });
                milestone = ms.data.find((m) => m.title === 'v1.0.0') || null;
                if (!milestone) {
                  const createdMs = await github.rest.issues.createMilestone({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: 'v1.0.0',
                    description: 'Initial v1.0.0 release milestone (auto-created).',
                  });
                  milestone = createdMs.data;
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  milestone: milestone.number,
                });
                core.info(`Set milestone v1.0.0 on issue #${issue.number}`);
              } catch (e) {
                core.warning(`Failed to set milestone: ${e.message}`);
              }
            }

            // Advance status: needs-triage -> needs-review.
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'needs-triage',
              });
            } catch (e) {
              core.info(`needs-triage label not present or already removed: ${e.message}`);
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-review'],
              });
            } catch (e) {
              core.warning(`Failed to add needs-review label: ${e.message}`);
            }
